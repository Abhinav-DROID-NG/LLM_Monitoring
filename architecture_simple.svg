<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="400" fill="#ffffff"/>

  <text x="640" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#2C2C2A">Layer-Attribution Monitor: Blind Live-LLM Test Architecture</text>
  <text x="640" y="60" text-anchor="middle" font-size="13" fill="#5F5E5A">Detect a behaviour change, then attribute it to model, serving stack, safety settings or request configuration</text>

  <!-- Provider side -->
  <rect x="640" y="80" width="620" height="260" rx="14" fill="#FDF6E8" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="660" y="102" font-size="13" font-weight="600" fill="#854F0B">PROVIDER SIDE: we control it, the monitor cannot see inside</text>

  <!-- Scheduler -->
  <rect x="40" y="130" width="200" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="140" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Probe scheduler</text>
  <text x="140" y="187" text-anchor="middle" font-size="12" fill="#5F5E5A">runs pinned canaries</text>
  <text x="140" y="203" text-anchor="middle" font-size="12" fill="#5F5E5A">every N minutes</text>

  <!-- Canary library -->
  <rect x="40" y="250" width="200" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="140" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Canary library</text>
  <text x="140" y="295" text-anchor="middle" font-size="11" fill="#5F5E5A">81 synthetic tasks, 9 divisions</text>
  <text x="140" y="311" text-anchor="middle" font-size="11" fill="#5F5E5A">easy / general / expensive</text>
  <line x1="140" y1="250" x2="140" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#aGray)"/>

  <!-- Alias endpoint -->
  <rect x="320" y="130" width="210" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="425" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">Alias endpoint</text>
  <text x="425" y="183" text-anchor="middle" font-size="13" fill="#185FA5">“support-bot-v1”</text>
  <text x="425" y="203" text-anchor="middle" font-size="11" fill="#185FA5">all the monitor ever sees</text>

  <line x1="240" y1="175" x2="320" y2="175" stroke="#185FA5" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <text x="280" y="167" text-anchor="middle" font-size="10" fill="#185FA5">probe</text>

  <!-- Router -->
  <rect x="680" y="120" width="250" height="70" rx="10" fill="#FFE9B8" stroke="#BA7517" stroke-width="1.5"/>
  <text x="805" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#633806">Router / alias proxy</text>
  <text x="805" y="168" text-anchor="middle" font-size="12" fill="#854F0B">changes layers on a secret schedule</text>

  <line x1="530" y1="165" x2="680" y2="165" stroke="#185FA5" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <text x="590" y="157" text-anchor="middle" font-size="10" fill="#185FA5">model name only</text>

  <!-- Layer switches -->
  <rect x="680" y="205" width="250" height="120" rx="10" fill="#FFF3DC" stroke="#BA7517" stroke-width="1.2"/>
  <text x="805" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Secret layer switches</text>
  <text x="696" y="247" font-size="12" fill="#854F0B">1. Model / alias: repoint A → B</text>
  <text x="696" y="266" font-size="12" fill="#854F0B">2. Safety: stricter or looser filter</text>
  <text x="696" y="285" font-size="12" fill="#854F0B">3. Request config: temp, max_tokens,</text>
  <text x="712" y="301" font-size="12" fill="#854F0B">system prompt</text>
  <text x="696" y="318" font-size="12" fill="#854F0B">4. Serving: other host / quantization</text>
  <line x1="805" y1="190" x2="805" y2="205" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aOrange)"/>

  <!-- Real LLMs -->
  <rect x="990" y="110" width="250" height="45" rx="8" fill="#FFE9B8" stroke="#BA7517" stroke-width="1.2"/>
  <text x="1115" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Real LLM A (healthy)</text>
  <rect x="990" y="165" width="250" height="45" rx="8" fill="#FFE9B8" stroke="#BA7517" stroke-width="1.2"/>
  <text x="1115" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Real LLM B (swap target)</text>
  <rect x="990" y="220" width="250" height="45" rx="8" fill="#FFE9B8" stroke="#BA7517" stroke-width="1.2"/>
  <text x="1115" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Real LLM C / other host</text>
  <line x1="930" y1="145" x2="990" y2="132" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aOrange)"/>
  <line x1="930" y1="155" x2="990" y2="187" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aOrange)"/>
  <line x1="930" y1="165" x2="990" y2="242" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aOrange)"/>

  <!-- Sealed log -->
  <rect x="990" y="277" width="250" height="45" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="1115" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#791F1F">Sealed ground-truth log</text>
  <text x="1115" y="313" text-anchor="middle" font-size="11" fill="#A32D2D">time + true layer, hash committed first</text>
  <line x1="930" y1="305" x2="990" y2="299" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#aOrange)"/>

  <!-- Response path back to the monitor -->
  <line x1="425" y1="220" x2="425" y2="300" stroke="#185FA5" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <text x="425" y="320" text-anchor="middle" font-size="11" fill="#185FA5">responses + metadata</text>
  <text x="425" y="336" text-anchor="middle" font-size="11" fill="#185FA5">(latency, tokens, finish reason)</text>
  <text x="425" y="352" text-anchor="middle" font-size="11" fill="#185FA5">go to the monitor</text>

  <!-- Legend -->
  <g font-size="12" fill="#444441">
    <line x1="40" y1="385" x2="80" y2="385" stroke="#185FA5" stroke-width="2" marker-end="url(#aBlue)"/>
    <text x="90" y="389">What the monitor sees</text>
    <line x1="260" y1="385" x2="300" y2="385" stroke="#BA7517" stroke-width="2" marker-end="url(#aOrange)"/>
    <text x="310" y="389">Secret provider-side routing</text>
    <line x1="540" y1="385" x2="580" y2="385" stroke="#A32D2D" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="590" y="389">Ground truth, hidden until evaluation</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
